
<!DOCTYPE html>
<html>
<head>
    <title>Weather Forecast & Alert</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf4ff;
            text-align: center;
            padding: 40px 15px;
        }
        .container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 25px;
            border-radius: 12px;
        }
        input, button {
            padding: 12px;
            margin: 8px;
            border-radius: 6px;
        }
        button {
            background: #0879d1;
            color: white;
            border: none;
            cursor: pointer;
        }
        #result {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Weather Forecast & Alert</h1>
        <input type="text" id="city" placeholder="Enter city name">
        <button onclick="getWeather()">Check Weather</button>
        <div id="result"></div>
    </div>

    <script>
        async function getWeather() {
            const city = document.getElementById("city").value.trim();
            const result = document.getElementById("result");

            if (!city) {
                result.innerHTML = "Please enter a city name.";
                return;
            }

            result.innerHTML = "Loading...";

            try {
                const response = await fetch(
                    `/api/weather?city=${encodeURIComponent(city)}`
                );
                const data = await response.json();

                if (!response.ok) {
                    result.innerHTML = data.error || "Weather not found.";
                    return;
                }

                result.innerHTML = `
                    <h2>${data.city}</h2>
                    <p>Temperature: ${data.temperature} °C</p>
                    <p>Humidity: ${data.humidity}%</p>
                    <p>Weather: ${data.description}</p>
                    <p>Wind Speed: ${data.wind_speed} m/s</p>
                    <h3>Alerts</h3>
                    <p>${data.alerts.length ? data.alerts.join("<br>") : "No alerts"}</p>
                `;
            } catch (error) {
                result.innerHTML = "Unable to get weather. Please try again.";
            }
        }
    </script>
</body>
</html>
